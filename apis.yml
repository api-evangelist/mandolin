name: Mandolin
description: 'Mandolin (operating as Coral Automation, Inc.) is a San Francisco-based AI automation
  platform for specialty pharmaceutical workflows, serving infusion centers and specialty pharmacies.
  Its AI agents handle the complete back-office lifecycle — patient intake, benefits verification, prior
  authorization, claims, and revenue cycle management — by navigating existing systems, reading faxes,
  and reasoning over data rather than through developer integrations. The company explicitly markets a
  no-API, no-integration approach ("Every step, fully automated"), citing outcomes such as 24x faster
  document processing and eliminated prescription backlogs. Backed by Greylock and SV Angel.'
